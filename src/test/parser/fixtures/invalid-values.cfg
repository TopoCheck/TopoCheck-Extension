hostname RecoveryRouter
interface GigabitEthernet0/0
 ip address 192.0.2.1 255.255.255.0
 ip address 999.0.0.1 255.255.255.0
 ip address 192.0.2.2 255.0.255.0
 shutdown extra
 description
 description Recovered
 no shutdown
!
router ospf 1
 router-id 10.0.0.1
 router-id 999.0.0.1
 network 10.0.0.0 0.0.255.0 area 0
 network 10.0.0.0 0.255.255.255 area 0
!
ip route 10.0.0.1 255.0.0.0 192.0.2.254
ip route 0.0.0.0 0.0.0.0 192.0.2.254
end
