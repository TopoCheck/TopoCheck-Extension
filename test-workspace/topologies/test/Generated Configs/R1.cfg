hostname R1
ip access-list extended INSIDE
 permit ip host 20.10.10.1 host 192.168.10.0
 permit ip 21.10.10.0 0.0.0.255 any
 exit
ip access-list extended OUTSIDE
 permit ip 192.168.10.0 0.0.0.255 20.10.10.0 0.0.0.255
 exit
interface GigabitEthernet0/0
 ip access-group INSIDE in
 ip access-group OUTSIDE out
 exit
end